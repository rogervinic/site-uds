<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDS Sebrae RN · Unidade de Desenvolvimento Setorial</title>
<meta name="description" content="Gestão por setor, feiras, missões e soluções do Sebrae RN para pequenos negócios do Rio Grande do Norte.">
<link rel="icon" href="assets/img/logo-sebrae-branca.png">
<link rel="stylesheet" href="assets/fontes/archivo.css">
<style>
body{margin:0;font-family:'Archivo',sans-serif;background:#0A0F2C;color:#0A0F2C}
a{color:inherit}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(170,190,255,.55) 1.1px,transparent 1.7px),radial-gradient(circle,rgba(150,120,255,.35) 1px,transparent 1.6px);background-size:12px 12px,17px 17px;background-position:0 0,6px 9px;-webkit-mask-image:radial-gradient(ellipse 70% 85% at 78% 30%,#000 0%,rgba(0,0,0,.55) 40%,transparent 75%);mask-image:radial-gradient(ellipse 70% 85% at 78% 30%,#000 0%,rgba(0,0,0,.55) 40%,transparent 75%)}
.dots-sm{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(170,190,255,.35) 1px,transparent 1.6px);background-size:14px 14px;-webkit-mask-image:linear-gradient(110deg,transparent 30%,#000 100%);mask-image:linear-gradient(110deg,transparent 30%,#000 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.marquee{display:flex;width:max-content;animation:rolar 38s linear infinite}
.marquee-lento{display:flex;width:max-content;animation:rolar 50s linear infinite}
.faixa:hover .marquee,.faixa:hover .marquee-lento{animation-play-state:paused}
@keyframes rolar{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.marquee,.marquee-lento{animation:none}}
.nav-links{display:flex}
.nav-toggle{display:none}
@media (max-width: 900px){.nav-links{display:none}.nav-toggle{display:inline-flex}}
.lk:hover{color:#FFFFFF}
.btn-claro:hover{background:#DCE4FF}
.btn-azul:hover{background:#3B6BFF}
.card-gestor img{filter:grayscale(1);transition:filter .35s ease,transform .5s ease}
.card-gestor:hover img{filter:grayscale(0);transform:scale(1.3)}
.card-gestor:hover{background:#24186A}
.card-gestor:hover .seta{background:#FFFFFF;color:#1B1150}
.uf{cursor:pointer;transition:fill .3s ease}
.uf:hover{opacity:.85}
.trilho{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mapa-g{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.ev-card{transition:border-color .2s ease,transform .2s ease}
.ev-card:hover{transform:translateY(-3px)}
button:focus-visible,a:focus-visible{outline:3px solid #8EA8FF;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<template id="pagina">
<div id="topo" style="background: #F3EFE7; font-family: 'Archivo', sans-serif; font-size: 17px; line-height: 1.55; color: #0A0F2C">

<section style="position: relative; overflow: hidden; background: #0A0F2C; color: #FFFFFF; min-height: 760px; display: flex; flex-direction: column">
<div class="glow" style="width: 620px; height: 620px; right: -120px; top: -160px; background: #2B4BFF; opacity: 0.35"></div>
<div class="glow" style="width: 520px; height: 520px; right: 260px; top: 220px; background: #6A3DE8; opacity: 0.28"></div>
<div class="dots"></div>

<div style="position: sticky; top: 0; z-index: 20; padding: 18px clamp(12px, 3vw, 32px) 0">
<header style="max-width: 1240px; margin: 0 auto; background: rgba(12, 18, 52, 0.82); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px; padding: 8px 8px 8px 22px; display: flex; align-items: center; gap: 24px; backdrop-filter: blur(10px)">
<a href="#topo" style="display: flex; align-items: center; gap: 12px; text-decoration: none; min-height: 44px; color: #FFFFFF">
<img src="assets/img/logo-sebrae-branca.png" alt="Sebrae" style="height: 30px; width: auto">
<span style="width: 1px; height: 26px; background: rgba(255, 255, 255, 0.35)"></span>
<span style="font-stretch: 112%; font-weight: 800; font-size: 20px; letter-spacing: 0.02em">UDS</span>
</a>
<nav aria-label="Principal" class="nav-links" style="align-items: center; gap: 4px; margin-left: auto">
<button type="button" onClick="{{alternarSetores}}" aria-expanded="{{setoresAberto}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: none; background: transparent; color: #C9D3FF; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 15px; cursor: pointer">Setores
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{giroSeta}}deg); transition: transform .2s"><path d="M6 9l6 6 6-6"></path></svg></button>
<a href="#como" class="lk" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; text-decoration: none; color: #C9D3FF; font-weight: 500; font-size: 15px">Como trabalhamos</a>
<a href="#gestores" class="lk" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; text-decoration: none; color: #C9D3FF; font-weight: 500; font-size: 15px">Gestores</a>
<a href="#eventos" class="lk" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; text-decoration: none; color: #C9D3FF; font-weight: 500; font-size: 15px">Eventos</a>
<a href="#cases" class="lk" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; text-decoration: none; color: #C9D3FF; font-weight: 500; font-size: 15px">Cases</a>
<a href="#duvidas" class="lk" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; text-decoration: none; color: #C9D3FF; font-weight: 500; font-size: 15px">Dúvidas</a>
</nav>
<a href="#contato" class="btn-claro nav-links" style="align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: #0A0F2C; text-decoration: none; font-weight: 700; font-size: 15px">Fale com a gente</a>
<button type="button" class="nav-toggle" onClick="{{alternarMenu}}" aria-expanded="{{menuAberto}}" style="margin-left: auto; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: none; border-radius: 999px; background: #FFFFFF; color: #0A0F2C; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">{{rotuloMenu}}</button>
</header>

<sc-if value="{{setoresAberto}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 1240px; margin: 10px auto 0; display: flex; justify-content: flex-end">
<div style="width: min(560px, 100%); background: #FFFFFF; color: #0A0F2C; border-radius: 22px; padding: 14px; box-shadow: 0 24px 60px rgba(5, 8, 30, 0.45); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px">
<sc-for list="{{gestores}}" as="g" hint-placeholder-count="9">
<a href="{{g.href}}" onClick="{{fecharTudo}}" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; text-decoration: none; min-height: 44px; background: #FFFFFF">
<img data-dc-src="{{g.foto}}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover">
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 700; font-size: 15px">{{g.setor}}</span><span style="font-size: 13px; color: #555A75">{{g.nome}}</span></span>
</a>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{menuAberto}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 1240px; margin: 10px auto 0; background: #FFFFFF; color: #0A0F2C; border-radius: 22px; padding: 12px; box-shadow: 0 24px 60px rgba(5, 8, 30, 0.45); display: flex; flex-direction: column">
<a href="#gestores" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-weight: 600">Setores e gestores</a>
<a href="#como" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-weight: 600">Como trabalhamos</a>
<a href="#eventos" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-weight: 600">Eventos</a>
<a href="#cases" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-weight: 600">Cases</a>
<a href="#duvidas" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-weight: 600">Dúvidas</a>
<a href="#contato" onClick="{{fecharTudo}}" style="min-height: 48px; display: flex; align-items: center; justify-content: center; margin-top: 6px; border-radius: 999px; background: #0A0F2C; color: #FFFFFF; text-decoration: none; font-weight: 700">Fale com a gente</a>
</div>
</sc-if>
</div>

<div style="position: relative; flex: 1 1 auto; max-width: 1240px; width: 100%; margin: 0 auto; padding: clamp(72px, 12vw, 150px) clamp(16px, 4vw, 40px) 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px; font-size: 14px; color: #C9D3FF"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5B8CFF; box-shadow: 0 0 0 4px rgba(91, 140, 255, 0.25)"></span>Sebrae RN · Unidade de Desenvolvimento Setorial</span>
<h1 style="margin: 0; max-width: 980px; font-stretch: 112%; font-weight: 800; font-size: clamp(46px, 7.4vw, 108px); line-height: 0.96; letter-spacing: -0.035em; color: #FFFFFF">O Sebrae que fala a língua do <em style="font-style: italic; color: #8EA8FF">seu setor.</em></h1>
<p style="margin: 0; max-width: 560px; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.5; color: #C9D3FF">Nove cadeias produtivas do Rio Grande do Norte, cada uma com gestão dedicada, para crescer com gestão, inovação e acesso a mercado.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<a href="#gestores" class="btn-claro" style="display: inline-flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 10px 0 28px; border-radius: 999px; background: #FFFFFF; color: #0A0F2C; text-decoration: none; font-weight: 700; font-size: 17px">Encontre seu setor
<span style="width: 40px; height: 40px; border-radius: 50%; background: #2B4BFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></a>
<a href="#como" style="display: inline-flex; align-items: center; min-height: 58px; padding: 0 28px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.4); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px; box-sizing: border-box">Como trabalhamos</a>
</div>
</div>

<div class="faixa" aria-label="Programas e parceiros" style="position: relative; overflow: hidden; border-top: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); padding: 18px 0">
<div class="marquee">
<sc-for list="{{programasDuplo}}" as="p" hint-placeholder-count="20">
<span style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; white-space: nowrap; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #E3E8FF">{{p}}<svg width="14" height="14" viewBox="0 0 24 24" fill="#5B8CFF" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"></path></svg></span>
</sc-for>
</div>
</div>
</section>

<section aria-label="Nossa missão" style="max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px) clamp(56px, 7vw, 88px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 20px 72px; align-items: baseline">
<p style="flex: 1 1 180px; margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #1F4FD1"><span style="width: 22px; height: 2px; background: #1F4FD1"></span>Nossa missão</p>
<p style="flex: 999 1 640px; min-width: 0; margin: 0; font-stretch: 112%; font-weight: 600; font-size: clamp(26px, 3.2vw, 42px); line-height: 1.2; letter-spacing: -0.02em">Impulsionar a transformação dos pequenos negócios por meio da <em style="font-style: italic; color: #1F4FD1">inovação, do empreendedorismo, da gestão e do acesso a mercado.</em></p>
</section>

<section id="como" style="position: relative; overflow: hidden; background: #0A0F2C; color: #FFFFFF; margin: 0 clamp(0px, 1.5vw, 20px); border-radius: clamp(0px, 2vw, 32px)">
<div class="dots-sm"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 112px) clamp(16px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px 80px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #8EA8FF"><span style="width: 22px; height: 2px; background: #8EA8FF"></span>Como trabalhamos</p>
<h2 style="margin: 0; font-stretch: 112%; font-weight: 800; font-size: clamp(36px, 4.6vw, 62px); line-height: 1.02; letter-spacing: -0.03em">A empresa entra de onde está e avança nas <em style="font-style: italic; color: #8EA8FF">cinco frentes.</em></h2>
<p style="margin: 0; font-size: 18px; color: #B8C2EC; max-width: 420px">O resultado que buscamos é competitividade, da empresa e de toda a cadeia produtiva.</p>
</div>
<ol style="flex: 999 1 520px; min-width: 0; margin: 0; padding: 0; list-style: none; border-bottom: 1px solid rgba(255, 255, 255, 0.18)">
<li style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.18)"><span style="flex: none; width: 56px; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #8EA8FF">01</span><span style="flex: 1 1 200px; font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15">Gestão</span><span style="flex: 2 1 260px; font-size: 16px; color: #B8C2EC">Diagnóstico, consultoria em gestão e jornadas de liderança, finanças e atendimento.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.18)"><span style="flex: none; width: 56px; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #8EA8FF">02</span><span style="flex: 1 1 200px; font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15">Inovação em processo</span><span style="flex: 2 1 260px; font-size: 16px; color: #B8C2EC">Sebraetec, TOC, 5S e Brasil Mais Produtivo para produzir melhor e com menos perda.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.18)"><span style="flex: none; width: 56px; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #8EA8FF">03</span><span style="flex: 1 1 200px; font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15">Inovação em produto</span><span style="flex: 2 1 260px; font-size: 16px; color: #B8C2EC">Desenvolvimento de coleções, novos produtos, rótulos e embalagens.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.18)"><span style="flex: none; width: 56px; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #8EA8FF">04</span><span style="flex: 1 1 200px; font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15">Mercado</span><span style="flex: 2 1 260px; font-size: 16px; color: #B8C2EC">Feiras, rodadas de negócios, showrooms e missões no Brasil e no exterior.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.18)"><span style="flex: none; width: 56px; font-stretch: 112%; font-weight: 700; font-size: 20px; color: #8EA8FF">05</span><span style="flex: 1 1 200px; font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15">Governança</span><span style="flex: 2 1 260px; font-size: 16px; color: #B8C2EC">Articulação com sindicatos, associações e parceiros de cada cadeia produtiva.</span></li>
</ol>
</div>
</section>

<section id="gestores" style="max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); box-sizing: border-box">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 48px; margin-bottom: 40px">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #1F4FD1"><span style="width: 22px; height: 2px; background: #1F4FD1"></span>Setores e gestores</p>
<h2 style="margin: 0; font-stretch: 112%; font-weight: 800; font-size: clamp(36px, 4.6vw, 62px); line-height: 1.02; letter-spacing: -0.03em">Uma pessoa que conhece <em style="font-style: italic; color: #1F4FD1">o seu mercado.</em></h2>
</div>
<p style="flex: 1 1 300px; margin: 0; font-size: 17px; color: #4A4F6A">Escolha o setor e conheça os projetos, as feiras e as soluções que a gestão leva até as empresas.</p>
</div>
<div style="position: relative; overflow: hidden; border-radius: 30px; background: #0A0F2C; color: #FFFFFF; padding: clamp(24px, 3.5vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px; margin-bottom: 14px">
<div class="dots"></div>
<div style="position: relative; display: flex; align-items: center; gap: 24px; flex: 999 1 460px; min-width: 0; flex-wrap: wrap">
<span style="flex: none; width: 168px; height: 168px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 8px rgba(142, 168, 255, 0.22)"><img src="assets/img/veronica.jpg" alt="Foto de Verônica Melo" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.24)"></span>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: #2B4BFF; font-size: 13px; font-weight: 700">Gerente da Unidade</span>
<span style="font-stretch: 112%; font-weight: 800; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.02; letter-spacing: -0.025em">Verônica Melo</span>
<span style="font-size: 16px; color: #C9D3FF; max-width: 460px">Lidera a Unidade de Desenvolvimento Setorial e coordena a gestão dos nove setores.</span>
</div>
</div>
<div style="position: relative; flex: 1 1 260px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #8EA8FF">Equipe de gestão setorial</span>
<div style="display: flex; flex-wrap: wrap">
<sc-for list="{{gestoresUnicos}}" as="gu" hint-placeholder-count="8">
<img data-dc-src="{{gu.foto}}" alt="{{gu.nome}}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin-right: -10px; border: 3px solid #0A0F2C; box-sizing: border-box">
</sc-for>
</div>
</div>
</div>
<p style="margin: 6px 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #4A4F6A"><span style="width: 22px; height: 2px; background: #4A4F6A"></span>Gestão por setor, em ordem alfabética</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px">
<sc-for list="{{gestores}}" as="g" hint-placeholder-count="9">
<a href="{{g.href}}" class="card-gestor" aria-label="{{g.aria}}" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 22px; min-height: 290px; padding: 24px; box-sizing: border-box; border-radius: 26px; background: #1B1150; text-decoration: none; color: #FFFFFF">
<div class="dots-sm" style="opacity: 0.5"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start">
<span style="width: 132px; height: 132px; border-radius: 50%; overflow: hidden; display: block; box-shadow: 0 0 0 6px rgba(142, 168, 255, 0.18)"><img data-dc-src="{{g.foto}}" alt="" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.24)"></span>
<span style="font-stretch: 112%; font-weight: 700; font-size: 15px; color: #8EA8FF">{{g.num}}</span>
</div>
<div style="position: relative; margin-top: auto; display: flex; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.08; letter-spacing: -0.015em">{{g.setor}}</span>
<span style="font-size: 15px; color: #C9D3FF">{{g.nome}}</span>
</div>
<span class="seta" style="flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.55); display: flex; align-items: center; justify-content: center; transition: background .2s ease, color .2s ease"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></span>
</div>
</a>
</sc-for>
</div>
</section>

<section id="eventos" style="position: relative; overflow: hidden; background: #1B1150; color: #FFFFFF">
<div class="dots-sm" style="opacity: 0.7"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; padding: clamp(72px, 10vw, 128px) clamp(16px, 4vw, 40px); box-sizing: border-box">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 40px; margin-bottom: 36px">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #8EA8FF"><span style="width: 22px; height: 2px; background: #8EA8FF"></span>Feiras e missões 2026</p>
<h2 style="margin: 0; font-stretch: 112%; font-weight: 800; font-size: clamp(36px, 4.6vw, 62px); line-height: 1.02; letter-spacing: -0.03em">Levamos o cliente <em style="font-style: italic; color: #8EA8FF">até o mercado.</em></h2>
</div>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{anterior}}" disabled="{{semAnterior}}" aria-label="Evento anterior" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.45); background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{opAnterior}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{proximo}}" disabled="{{semProximo}}" aria-label="Próximo evento" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #FFFFFF; color: #1B1150; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{opProximo}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div style="overflow: hidden; margin: 0 -4px; padding: 4px">
<div class="trilho" style="display: flex; gap: 16px; transform: translateX(-{{deslocamento}}px)">
<sc-for list="{{eventos}}" as="ev" hint-placeholder-count="6">
<button type="button" onClick="{{ev.escolher}}" aria-pressed="{{ev.ativo}}" class="ev-card" style="flex: 0 0 290px; min-height: 210px; text-align: left; border-radius: 22px; border: 2px solid {{ev.borda}}; background: {{ev.fundo}}; color: {{ev.cor}}; padding: 22px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; font-family: 'Archivo', sans-serif; opacity: {{ev.opacidade}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%">
<span style="font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{ev.seloFundo}}; color: {{ev.seloCor}}">{{ev.status}}</span>
<span style="font-size: 13px; font-weight: 600; opacity: 0.8">{{ev.setor}}</span>
</span>
<span style="font-stretch: 112%; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em; margin-top: 8px">{{ev.dataTexto}}</span>
<span style="font-stretch: 112%; font-weight: 700; font-size: 21px; line-height: 1.15">{{ev.nome}}</span>
<span style="margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; opacity: 0.85"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{ev.local}}</span>
</button>
</sc-for>
</div>
</div>
<p style="margin: 14px 0 0; font-size: 14px; color: #B8C2EC">{{posicao}} · Clique num evento para ver onde ele acontece. Datas sujeitas a atualização.</p>

<div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
<div style="flex: 999 1 520px; min-width: 0; position: relative; border-radius: 28px; background: #0A0F2C; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1)">
<div style="position: absolute; left: 22px; top: 18px; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<span style="font-size: 14px; font-weight: 600; color: #B8C2EC">{{rotuloMapa}}</span>
<sc-if value="{{temVoltar}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{voltar}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.45); background: transparent; color: #FFFFFF; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer">{{rotuloVoltar}}</button>
</sc-if>
</div>

const bbs = {};
this.estados().forEach((e) => { nomesUf[e.id] = e.nome; bbs[e.id] = e.bb; });

const gestores = this.gestoresBase().map((g, i) => Object.assign({}, g, { num: String(i + 1).padStart(2, '0'), aria: g.setor + ', gestão de ' + g.nome }));

const ufSel = (st.vista || 'mundo') === 'brasil' ? (st.uf || null) : null;
const base = this.eventosBase().map((e, i) => {
const encerrado = e.fim ? e.fim < hoje : false;
const agora = e.ini ? (!encerrado && e.ini <= hoje) : false;
return Object.assign({ idx: i }, e, { encerrado: encerrado, agora: agora });
});
const datados = base.filter((e) => e.ini).sort((a, b) => (a.ini < b.ini ? -1 : 1));
const semData = base.filter((e) => !e.ini);
const lista = datados.concat(semData);
let marcou = false;
lista.forEach((e) => { e.proximo = false; if (e.ini && !e.encerrado && !e.agora && !marcou) { e.proximo = true; marcou = true; } });
const inicio = Math.max(0, lista.findIndex((e) => e.ini && !e.encerrado));
const pos = st.pos === undefined ? inicio : st.pos;
const evSel = st.ev === undefined ? null : st.ev;
const paisId = { 'China': 'cn', 'Itália': 'it' };
const escolherEv = (e) => () => this.setState({ ev: e.idx, uf: e.uf || null, pais: e.pais ? paisId[e.pais] : null, vista: e.uf ? 'brasil' : 'mundo' });
const statusDe = (e) => e.agora ? 'Acontecendo' : (e.proximo ? 'Próximo' : (e.encerrado ? 'Realizado' : (e.ini ? 'Em breve' : 'Data a definir')));
const localDe = (e) => e.uf ? ((e.cidade ? e.cidade + ', ' : '') + nomesUf[e.uf]) : (e.pais || 'Local a confirmar');
const eventos = lista.map((e) => {
const ativo = evSel === e.idx;
const destaque = e.proximo || e.agora;
return Object.assign({}, e, {
dataTexto: this.dataTexto(e), status: statusDe(e), local: localDe(e), ativo: ativo,
fundo: ativo ? '#FFFFFF' : (destaque ? '#2B4BFF' : 'rgba(255,255,255,0.06)'),
cor: ativo ? '#0A0F2C' : '#FFFFFF',
borda: ativo ? '#9EB4FF' : 'rgba(255,255,255,0.14)',
seloFundo: ativo ? '#E6EBFF' : (destaque ? '#FFFFFF' : 'rgba(255,255,255,0.14)'),
seloCor: ativo || destaque ? '#1B1150' : '#FFFFFF',
opacidade: e.encerrado && !ativo ? '0.62' : '1',
escolher: escolherEv(e)
});
});
const maxPos = Math.max(0, lista.length - 1);
const passo = 306;

const porUf = {};
base.forEach((e) => { if (e.uf) { (porUf[e.uf] = porUf[e.uf] || []).push(e); } });
const escolherUf = (id) => () => this.setState({ uf: id, ev: null, pais: null, vista: 'brasil' });
const mapa = {};
this.estados().forEach((e) => {
const tem = !!porUf[e.id];
mapa[e.id] = { fill: ufSel === e.id ? '#9EB4FF' : (tem ? '#4F6BFF' : '#1E2550'), click: tem ? escolherUf(e.id) : () => this.setState({ uf: null, ev: null }) };
});
let tx = 0, ty = 0, s = 1;
if (ufSel && bbs[ufSel]) {
const b = bbs[ufSel];
s = Math.min(4.2, Math.min(613 / b[2], 639 / b[3]) * 0.5);
tx = 306.5 - s * (b[0] + b[2] / 2);
ty = 319.5 - s * (b[1] + b[3] / 2);
}
const vista = st.vista || 'mundo';
const paisSel = st.pais || null;
const nomesPais = { cn: 'China', it: 'Itália', br: 'Brasil' };
const bbPais = { br: [267.2, 448.3, 110.0, 114.6], cn: [681.5, 285.3, 171.5, 125.9], it: [493.5, 313.6, 33.2, 39.1] };
const porPais = {};
base.forEach((e) => { if (e.pais) { const id = paisId[e.pais]; (porPais[id] = porPais[id] || []).push(e); } });
const escolherPais = (id) => () => this.setState({ pais: id, ev: null, uf: null, vista: 'mundo' });
const w = {
br: { fill: '#4F6BFF', click: () => this.setState({ vista: 'brasil', uf: null, pais: null, ev: null }) },
cn: { fill: paisSel === 'cn' ? '#9EB4FF' : '#4F6BFF', click: escolherPais('cn') },
it: { fill: paisSel === 'it' ? '#9EB4FF' : '#4F6BFF', click: escolherPais('it') }
};
let mtx = 0, mty = 0, ms = 1;
if (vista === 'mundo' && paisSel && bbPais[paisSel]) {
const b = bbPais[paisSel];
ms = Math.min(5, Math.min(1010 / b[2], 666 / b[3]) * 0.45);
mtx = 505 - ms * (b[0] + b[2] / 2);
mty = 333 - ms * (b[1] + b[3] / 2);
}
const evAtual = evSel === null ? null : lista.find((e) => e.idx === evSel);
let painelRotulo, painelTitulo, painelTexto, painelEventos;
const ordenarUf = (arr) => arr.slice().sort((a, b) => ((a.ini || '9') < (b.ini || '9') ? -1 : 1));
if (evAtual) {
painelRotulo = evAtual.setor + ' · ' + statusDe(evAtual);
painelTitulo = evAtual.nome;
painelTexto = this.dataTexto(evAtual) + ' · ' + localDe(evAtual) + '. [Breve descrição da feira e do que a empresa leva de lá.]';
painelEventos = evAtual.uf ? ordenarUf(porUf[evAtual.uf]).filter((e) => e.idx !== evAtual.idx) : (evAtual.pais ? ordenarUf(porPais[paisId[evAtual.pais]]).filter((e) => e.idx !== evAtual.idx) : []);
} else if (vista === 'mundo' && paisSel) {
painelRotulo = 'País selecionado';
painelTitulo = nomesPais[paisSel];
painelTexto = porPais[paisSel].length + (porPais[paisSel].length === 1 ? ' missão ou feira em 2026.' : ' missões e feiras em 2026.');
painelEventos = ordenarUf(porPais[paisSel]);
} else if (vista === 'brasil' && !ufSel) {
painelRotulo = 'Brasil';
painelTitulo = Object.keys(porUf).length + ' estados com eventos';
painelTexto = 'Clique num estado colorido para ver as feiras e missões de lá.';
painelEventos = [];
} else if (ufSel) {
painelRotulo = 'Estado selecionado';
painelTitulo = nomesUf[ufSel];
painelTexto = porUf[ufSel].length + (porUf[ufSel].length === 1 ? ' evento em 2026.' : ' eventos em 2026.');
painelEventos = ordenarUf(porUf[ufSel]);
} else {
painelRotulo = 'Onde levamos nossos clientes';
painelTitulo = Object.keys(porUf).length + ' estados e 2 países';
painelTexto = 'Clique no Brasil para ver os estados, ou na China e na Itália para ver as missões internacionais.';
painelEventos = [];
}
painelEventos = painelEventos.map((e) => Object.assign({}, e, { dataTexto: this.dataTexto(e), status: statusDe(e), escolher: escolherEv(e) }));
const chipsUf = Object.keys(porUf).sort().map((id) => ({ sigla: id.toUpperCase(), ativo: ufSel === id, fundo: ufSel === id ? '#0A0F2C' : 'transparent', cor: ufSel === id ? '#FFFFFF' : '#0A0F2C', escolher: escolherUf(id) })).concat(['cn', 'it'].map((id) => ({ sigla: nomesPais[id], ativo: paisSel === id, fundo: paisSel === id ? '#0A0F2C' : 'transparent', cor: paisSel === id ? '#FFFFFF' : '#0A0F2C', escolher: escolherPais(id) })));

const aberta = st.faq === undefined ? 0 : st.faq;
const perguntas = this.perguntasBase().map((p, i) => Object.assign({}, p, { aberta: aberta === i, sinal: aberta === i ? '−' : '+', fundo: aberta === i ? '#2B4BFF' : 'rgba(255,255,255,0.04)', alternar: () => this.setState({ faq: aberta === i ? -1 : i }) }));

const deps = this.depoimentos();
const di = st.dep || 0;

const programas = ['Sebraetec', 'Brasil Mais Produtivo', 'Instituto Riachuelo', 'ABDI', 'Inovapan', 'Procompi', 'Acelera Varejo', 'Feito Potiguar', 'Geoparque Seridó', 'Costura Mais RN'];
const logos = ['[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]', '[LOGO EMPRESA]'];
const menuAberto = !!st.menu;
const setoresAberto = !!st.setores;

return Object.assign({
menuAberto: menuAberto, rotuloMenu: menuAberto ? 'Fechar' : 'Menu',
alternarMenu: () => this.setState({ menu: !menuAberto, setores: false }),
setoresAberto: setoresAberto, giroSeta: setoresAberto ? 180 : 0,
alternarSetores: () => this.setState({ setores: !setoresAberto, menu: false }),
fecharTudo: () => this.setState({ menu: false, setores: false }),
programasDuplo: programas.concat(programas),
logosDuplo: logos.concat(logos),
gestores: gestores,
eventos: eventos,
deslocamento: Math.min(pos, maxPos) * passo,
semAnterior: pos <= 0, semProximo: pos >= maxPos,
opAnterior: pos <= 0 ? '0.35' : '1', opProximo: pos >= maxPos ? '0.35' : '1',
anterior: () => this.setState({ pos: Math.max(0, pos - 1) }),
proximo: () => this.setState({ pos: Math.min(maxPos, pos + 1) }),
posicao: (Math.min(pos, maxPos) + 1) + ' de ' + lista.length,
mapaTx: tx.toFixed(1), mapaTy: ty.toFixed(1), mapaS: s.toFixed(3),
mostrarMundo: vista === 'mundo', mostrarBrasil: vista === 'brasil',
mundoTx: mtx.toFixed(1), mundoTy: mty.toFixed(1), mundoS: ms.toFixed(3),
temVoltar: vista === 'brasil' || !!paisSel,
rotuloVoltar: ufSel ? 'Ver Brasil todo' : 'Ver mapa-múndi',
voltar: () => this.setState(ufSel ? { uf: null, ev: null } : { vista: 'mundo', uf: null, pais: null, ev: null }),
rotuloMapa: vista === 'brasil' ? (ufSel ? nomesUf[ufSel] : 'Brasil') : (paisSel ? nomesPais[paisSel] : 'Mundo'),
gestoresUnicos: gestores.filter((g, i, arr) => arr.findIndex((x) => x.nome === g.nome) === i),
painelRotulo: painelRotulo, painelTitulo: painelTitulo, painelTexto: painelTexto, painelEventos: painelEventos,
chipsUf: chipsUf,
perguntas: perguntas,
depo: deps[di], depoPosicao: (di + 1) + ' / ' + deps.length,
depoAnterior: () => this.setState({ dep: (di + deps.length - 1) % deps.length }),
depoProximo: () => this.setState({ dep: (di + 1) % deps.length })
}, { m: mapa, w: w });
}
}
iniciarPagina(Component);
</script>
</body>
</html>
